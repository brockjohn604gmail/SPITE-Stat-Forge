                if (Array.isArray(data)) throw new Error('stamp path is a directory');
                const cnwh = Buffer.from(data.content, 'base64').toString('utf8');
                return { cnwh, wU: data.sha };
              } catch (e) {
                if (e.status === 404) return { cnwh: '', wU: undefined };
